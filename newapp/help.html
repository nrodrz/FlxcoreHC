<title>IT Knowledge Base</title>

<link rel="preconnect" href="https://fonts.googleapis.com"/>

<style>
:root{
 --bg:#F4F6F9; --card:#FFFFFF; --t1:#2E3A44; --t3:#697785; --t4:#95A1AD; --b1:#DCE3EB;
 --accent:#1D4D7A; --accentH:#0B2A4A; --accentL:#EAF1F6; --grad:#8FB3C7; --green:#3D9A6E;
 --font:'DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
 --shadow:0 1px 3px rgba(43,41,38,.06),0 1px 2px rgba(43,41,38,.04);
 --shadowLg:0 10px 30px rgba(43,41,38,.10);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--t1);-webkit-font-smoothing:antialiased;line-height:1.5}
a{color:var(--accent);text-decoration:none}.tabs{display:flex;gap:8px;margin-bottom:14px}.tab{padding:7px 14px;border-radius:8px;font-size:13px;font-weight:600;text-decoration:none;color:rgba(255,255,255,.85);background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.20)}.tab:hover{background:rgba(255,255,255,.26)}.tab.active{background:#fff;color:var(--accent)}.tab.active:hover{background:#fff}.kbLogo{max-height:34px;max-width:170px;object-fit:contain;margin-bottom:12px;display:block}
.hero{background:linear-gradient(135deg,var(--accent),var(--grad));color:#fff;padding:46px 20px 40px}
.wrap{max-width:920px;margin:0 auto;padding:0 20px}
.hero h1{font-size:27px;font-weight:700;letter-spacing:-.4px}
.hero p{opacity:.92;font-size:14.5px;margin-top:6px}
.search{margin-top:22px;position:relative}
.search input{width:100%;padding:14px 16px 14px 44px;border:none;border-radius:12px;font-family:var(--font);font-size:15px;outline:none;box-shadow:var(--shadowLg)}
.search svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);opacity:.5}
.main{max-width:920px;margin:-18px auto 60px;padding:0 20px;position:relative}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0 18px}
.chip{padding:7px 14px;border-radius:20px;background:var(--card);border:1px solid var(--b1);font-size:12.5px;font-weight:600;color:var(--t3);cursor:pointer;transition:.12s}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.card{background:var(--card);border:1px solid var(--b1);border-radius:14px;box-shadow:var(--shadow)}
.art{padding:18px 20px;cursor:pointer;transition:.12s}
.art:hover{box-shadow:var(--shadowLg);transform:translateY(-1px)}
.art+.art{margin-top:12px}
.art h3{font-size:15.5px;font-weight:700;margin-bottom:5px}
.art .ex{font-size:13px;color:var(--t3);line-height:1.55}
.meta{display:flex;align-items:center;gap:10px;margin-top:9px;font-size:11px;color:var(--t4)}
.badge{background:var(--accentL);color:var(--accentH);padding:2px 9px;border-radius:6px;font-weight:600;font-size:10.5px}
.detail{padding:30px 32px}
.detail h2{font-size:23px;font-weight:700;letter-spacing:-.3px;margin-bottom:10px}
.detail .body{margin-top:20px;font-size:14.5px;line-height:1.72;color:#46535F}
.detail .body h1,.detail .body h2,.detail .body h3{margin:22px 0 8px;line-height:1.3}
.detail .body p{margin:0 0 13px}.detail .body ul,.detail .body ol{margin:0 0 13px 22px}
.detail .body li{margin-bottom:5px}.detail .body code{background:var(--accentL);padding:1px 6px;border-radius:5px;font-size:13px}
.detail .body pre{background:#0B2A4A;color:#EAF1F6;padding:14px 16px;border-radius:10px;overflow:auto;margin:0 0 14px}
.detail .body a{text-decoration:underline}.detail .body table{border-collapse:collapse;margin:0 0 14px;width:100%;font-size:13.5px}.detail .body th,.detail .body td{border:1px solid var(--b1);padding:7px 10px;text-align:left;vertical-align:top}.detail .body th{background:var(--card);font-weight:700}.detail .body img{max-width:100%;border-radius:8px;margin:6px 0}
.back{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--accent);cursor:pointer;margin-bottom:6px}
.empty{padding:48px 20px;text-align:center;color:var(--t4);font-size:14px}
.staffnote{background:var(--card);border:1px solid var(--b1);border-radius:10px;box-shadow:var(--shadow);padding:10px 14px;margin-top:30px;color:var(--t3,var(--t4));font-size:13.5px}
.staffnote+.chips{margin-top:14px}
.spin{width:30px;height:30px;border:3px solid var(--b1);border-top-color:var(--accent);border-radius:50%;animation:s .8s linear infinite;margin:48px auto}
@keyframes s{to{transform:rotate(360deg)}}
.foot{border-top:1px solid var(--b1);margin-top:36px;padding-top:22px;text-align:center;color:var(--t4);font-size:12.5px}
.foot a{font-weight:600}
.catgrp{font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--t4);margin:22px 0 10px}
</style>
</head>
<body>
<div id="root"></div>
<script src="help.js?v=278386cb0e"></script><!-- BT90: compiled ahead of time from src/help.jsx -->
</body>
